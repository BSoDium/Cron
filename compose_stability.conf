// Compose can only infer stability for classes compiled in this build, so every external value type
// is treated as unstable and every composable taking one becomes permanently non-skippable. These
// kotlinx.datetime types are immutable (val-only fields, no observable state), so telling the
// compiler so is a statement of fact, not an override. Live-measured on a Pixel 7 (#176): without
// this, CollapsibleAlarmCard's LcdClock slot could never skip — it took a real recomposition on
// every collapse frame purely because it accepts a LocalTime.
kotlinx.datetime.LocalTime
kotlinx.datetime.LocalDate
kotlinx.datetime.LocalDateTime
kotlinx.datetime.Instant
kotlinx.datetime.TimeZone
