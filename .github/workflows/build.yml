name: Build CI

on:
  push:
    branches: [ main ]
  pull_request:
    # No `branches` filter — a stacked PR (base = another feature branch, not main) still needs
    # real CI, not just whatever repo-wide checks run regardless of base (#210).
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties
      run: |
        echo "GOOGLE_ROUTES_API_KEY=${{ secrets.GOOGLE_ROUTES_API_KEY }}" > local.properties

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Run lint checks
      run: ./gradlew lintDebug --stacktrace

    - name: Check file length
      run: ./gradlew :app:checkFileLength --stacktrace

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest --stacktrace

    - name: Upload unit test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-report
        path: app/build/reports/tests/testDebugUnitTest/

    - name: Upload build reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-reports
        path: |
          app/build/reports/
          app/build/outputs/logs/

