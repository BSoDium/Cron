name: Release CI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to re-summarize (e.g. v0.5.0)'
        required: true
      apply:
        description: 'Write the summary to the release (unchecked = dry-run, just logs it)'
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read

    steps:
      - name: Checkout code
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        if: github.event_name == 'push'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        if: github.event_name == 'push'
        run: chmod +x gradlew

      - name: Create local.properties
        if: github.event_name == 'push'
        run: |
          echo "GOOGLE_ROUTES_API_KEY=${{ secrets.GOOGLE_ROUTES_API_KEY }}" > local.properties

      - name: Decode signing keystore
        if: github.event_name == 'push'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android_keystore.jks

      - name: Build release APK
        if: github.event_name == 'push'
        env:
            # Absolute path: app/build.gradle.kts resolves file() against the :app module dir,
            # but the decode step writes to the workspace root.
            RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android_keystore.jks
            RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
            RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
            RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Get tag name
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Check if pre-release
        if: github.event_name == 'push'
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Strip leading 'v' then check for hyphen (e.g. 1.0.0-alpha.1)
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize release notes with AI
        uses: actions/github-script@v9
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          APPLY: ${{ github.event_name == 'push' || inputs.apply }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const script = require('./.github/scripts/summarize-release.js');
            await script({ github, context, core });
